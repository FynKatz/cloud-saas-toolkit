<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=266dd97a-5e4f-48fc-b798-675a60c67943
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 使用Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>字数统计工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background-color: #f5f5f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-family: inherit;
        }

        .stats {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f8f8f8;
            border-radius: 4px;
        }

        .stat-item {
            margin-bottom: 0.5rem;
        }

        .stat-item span {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
    <link rel="stylesheet" href="css/auth-styles.css">
    <script src="js/auth-config.js"></script>
    <script src="js/auth-check.js"></script>
</head>

<body>
    <div class="header-actions">
        <div class="header-left">
            <button onclick="goToHome()" class="home-btn">
                <i class="fas fa-home"></i>
                首页
            </button>
        </div>
        <div class="header-right">
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                退出
            </button>
        </div>
    </div>

    <script>
        // 调试代码
        console.log('页面加载完成');
        console.log('AUTH_CONFIG:', typeof AUTH_CONFIG !== 'undefined' ? '已加载' : '未加载');
        console.log('logout函数:', typeof logout !== 'undefined' ? '已定义' : '未定义');

        // 检查按钮是否存在
        setTimeout(() => {
            const btn = document.querySelector('.logout-btn');
            console.log('退出按钮:', btn ? '找到' : '未找到');
            if (btn) {
                console.log('按钮样式:', btn.style.cssText);
                console.log('按钮计算样式:', window.getComputedStyle(btn));
            }
        }, 100);
    </script>

    <div class="container">
        <h1>📝 字数统计工具</h1>
        <textarea id="text-input" placeholder="在此粘贴或输入您的文本..."></textarea>

        <div class="stats">
            <h2>统计结果：</h2>
            <div class="stat-item">字符数（含空格）：<span id="char-count">0</span></div>
            <div class="stat-item">字符数（不含空格）：<span id="char-no-space">0</span></div>
            <div class="stat-item">单词数（英文）：<span id="word-count">0</span></div>
            <div class="stat-item">行数：<span id="line-count">0</span></div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('text-input');
        const charCount = document.getElementById('char-count');
        const charNoSpace = document.getElementById('char-no-space');
        const wordCount = document.getElementById('word-count');
        const lineCount = document.getElementById('line-count');

        function updateStats() {
            const text = textarea.value;

            // 字符数（含空格）
            charCount.textContent = text.length;

            // 字符数（不含空格）
            const noSpaceText = text.replace(/\s/g, '');
            charNoSpace.textContent = noSpaceText.length;

            // 单词数（英文）
            const words = text.match(/\b\w+\b/g) || [];
            wordCount.textContent = words.length;

            // 行数
            const lines = text.split('\n').length;
            lineCount.textContent = lines;
        }

        textarea.addEventListener('input', updateStats);
    </script>
</body>

</html>
