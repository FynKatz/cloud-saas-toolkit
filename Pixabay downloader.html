<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=266dd97a-5e4f-48fc-b798-675a60c67943
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <title>Pixabay图片下载器</title>

    <!-- 使用Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .home-btn, .logout-btn {
            padding: 10px 15px;
            background: #4b6cb7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .home-btn:hover, .logout-btn:hover {
            background: #3556a3;
            transform: translateY(-2px);
        }

        h3 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 28px;
        }

        #picNum, #keyword {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4b6cb7;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #3556a3;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }

        .loading {
            background: #fff9c4;
            color: #7d6608;
        }

        .success {
            background: #d5f5e3;
            color: #1d8348;
        }

        .error {
            background: #fadbd8;
            color: #c0392b;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 14px;
            color: #1976d2;
        }
    </style>

    <link rel="stylesheet" href="css/auth-styles.css">
    <script src="js/auth-config.js"></script>
    <script src="js/auth-check.js"></script>

</head>

<body>
<div class="container">
    <div class="header-actions">
        <div class="header-left">
            <button onclick="goToHome()" class="home-btn">
                <i class="fas fa-home"></i>
                首页
            </button>
        </div>
        <div class="header-right">
            <button onclick="logout()" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                退出
            </button>
        </div>
    </div>

    <h3>Pixabay风景图片下载</h3>
    <input type="number" id="picNum" value="5" min="1" max="20" placeholder="下载数量">
    <input type="text" id="keyword" placeholder="输入关键词（如：山水）">
    <button onclick="downloadPixabay()">下载图片</button>
    <p id="status"></p>

    <div class="info-box">
        <i class="fas fa-info-circle"></i>
        下载的图片将按照"时间戳+5位随机数"的格式命名，例如: 1691589963557_48261.jpg
    </div>
</div>

<script>
    // 获取免费API Key步骤：
    // 1. 访问 https://pixabay.com/api/docs/
    // 2. 注册账号后获取密钥（替换下面的字符串）
    const PIXABAY_API_KEY = '9067334-64bc150336c9d15dd6ceaab3b';

    async function downloadPixabay() {
        const num = document.getElementById('picNum').value || 5;
        const keyword = document.getElementById('keyword').value || '山水';
        const zip = new JSZip();

        const statusElement = document.getElementById('status');
        statusElement.textContent = '正在请求图片数据...';
        statusElement.className = 'loading';

        try {
            // 调用Pixabay官方API
            const apiUrl = `https://pixabay.com/api/?key=${PIXABAY_API_KEY}&q=${encodeURIComponent(keyword)}&per_page=${num}`;
            const response = await fetch(apiUrl);
            const data = await response.json();

            if (data.hits.length === 0) {
                throw new Error('未找到相关图片，请尝试其他关键词');
            }

            statusElement.textContent = `找到 ${data.hits.length} 张图片，开始下载...`;

            // 并行下载图片
            const promises = data.hits.slice(0, num).map((img) => {
                return fetch(img.largeImageURL)
                    .then(res => res.blob())
                    .then(blob => {
                        // 修改文件名格式：时间戳+5位随机数
                        const timestamp = Date.now();
                        const randomNum = Math.floor(Math.random() * 90000) + 10000; // 生成5位随机数
                        zip.file(`${timestamp}_${randomNum}.jpg`, blob);
                    });
            });

            await Promise.all(promises);

            // 生成压缩包
            statusElement.textContent = '正在生成压缩文件...';
            zip.generateAsync({ type: "blob" }).then(content => {
                saveAs(content, `${keyword}_图片包.zip`);
                statusElement.textContent = `下载完成！共下载 ${data.hits.length} 张图片`;
                statusElement.className = 'success';
            });
        } catch (error) {
            statusElement.textContent = `错误: ${error.message}`;
            statusElement.className = 'error';
        }
    }
</script>
</body>

</html>
